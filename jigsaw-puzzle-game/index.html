<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片拼图小游戏</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202f;
      --muted: #657084;
      --paper: #f7f4ee;
      --panel: #ffffff;
      --line: #d8dde7;
      --blue: #246bfe;
      --green: #20936b;
      --red: #dc4c45;
      --amber: #d99120;
      --shadow: 0 14px 40px rgba(26, 35, 52, .13);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(135deg, rgba(255,255,255,.86), rgba(247,244,238,.92)),
        repeating-linear-gradient(45deg, rgba(36,107,254,.045) 0 12px, rgba(32,147,107,.045) 12px 24px);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      padding: 18px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: 0 12px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }

    button:hover {
      border-color: #aeb8c8;
      box-shadow: 0 6px 16px rgba(26, 35, 52, .1);
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    button.ghost {
      background: transparent;
    }

    button.icon {
      width: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .56;
      transform: none;
      box-shadow: none;
    }

    select,
    input[type="file"] {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 10px;
    }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(320px, 420px);
      gap: 16px;
      align-items: start;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(216, 221, 231, .92);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(26, 35, 52, .08);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 178px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      overflow: hidden;
      border: 1px solid rgba(24, 32, 47, .12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.36);
    }

    .mark span:nth-child(1) { background: #246bfe; }
    .mark span:nth-child(2) { background: #f6bf3f; }
    .mark span:nth-child(3) { background: #20936b; }
    .mark span:nth-child(4) { background: #e15c54; }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .controls {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(190px, .75fr) minmax(330px, 1.25fr) auto auto;
      gap: 10px;
      align-items: start;
    }

    .mode-card,
    .field-label {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 750;
      color: var(--muted);
      line-height: 1;
    }

    .mode-card button,
    .mode-card select {
      width: 100%;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f3f6fb;
    }

    .mode-tab {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      box-shadow: none;
      font-weight: 750;
      color: var(--muted);
    }

    .mode-tab[aria-selected="true"] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(26, 35, 52, .1);
    }

    .mode-panel {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .mode-panel[hidden] {
      display: none;
    }

    .game-setup {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .download-setup {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr minmax(98px, auto);
      align-items: end;
      gap: 8px;
    }

    .download-setup .field-label {
      gap: 8px;
    }

    .download-preview {
      min-width: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      display: grid;
      gap: 5px;
    }

    #downloadPreview {
      display: block;
      width: 100%;
      height: auto;
      max-height: 150px;
      border-radius: 6px;
      background: #ffffff;
      object-fit: contain;
    }

    .download-preview-meta {
      min-height: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .gap-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      min-width: 0;
      accent-color: var(--blue);
    }

    .gap-value {
      min-width: 42px;
      height: 26px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .stage {
      min-width: 0;
      display: grid;
      gap: 12px;
    }

    body[data-mode="download"] .stage,
    body[data-mode="download"] .side,
    body[data-mode="download"] #previewToggle,
    body[data-mode="download"] #resetBoard {
      display: none;
    }

    .board-wrap {
      min-height: calc(100vh - 112px);
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 14px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(216, 221, 231, .92);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .board-frame {
      position: relative;
      width: min(100%, 920px);
      aspect-ratio: var(--image-ratio, 4 / 3);
      max-height: calc(100vh - 150px);
      background: #e8edf5;
      border-radius: 8px;
      border: 1px solid #bec8d8;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.42), 0 18px 50px rgba(26,35,52,.18);
    }

    #board {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
      gap: var(--gap, 1px);
      padding: var(--gap, 1px);
      background: #9daabc;
      touch-action: none;
    }

    .cell {
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: visible;
      background:
        linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.24)),
        repeating-linear-gradient(45deg, rgba(24,32,47,.08) 0 5px, rgba(24,32,47,.02) 5px 10px);
      outline: 1px solid rgba(24,32,47,.06);
    }

    .cell.target {
      box-shadow: inset 0 0 0 3px rgba(36, 107, 254, .42);
    }

    .cell.locked::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 2px rgba(32, 147, 107, .58);
      pointer-events: none;
    }

    .side {
      min-width: 0;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(216, 221, 231, .92);
      border-radius: 8px;
      box-shadow: 0 10px 34px rgba(26, 35, 52, .09);
      overflow: hidden;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .stat {
      min-width: 0;
      padding: 12px 10px;
      background: var(--panel);
    }

    .stat b,
    .stat span {
      display: block;
    }

    .stat b {
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1;
      color: var(--ink);
    }

    .stat span {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .preview {
      padding: 10px;
    }

    .preview-head,
    .tray-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 0 10px;
    }

    .panel-title {
      min-width: 0;
      margin: 0;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .preview-box {
      width: 100%;
      aspect-ratio: var(--image-ratio, 4 / 3);
      border-radius: 6px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: #eef2f7;
    }

    #previewImage {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tray-panel {
      min-height: 0;
    }

    .tray-head {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--line);
    }

    .tray-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tray {
      height: calc(100vh - 390px);
      min-height: 220px;
      overflow: auto;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--piece-slot-width), 1fr));
      grid-auto-rows: minmax(var(--piece-slot-height), auto);
      gap: 10px;
      align-content: start;
      background: #fbfcff;
    }

    .piece-slot {
      min-width: 0;
      min-height: var(--piece-slot-height);
      padding: var(--piece-tab);
      display: grid;
      place-items: center;
      border-radius: 6px;
      overflow: visible;
    }

    .piece-slot.empty {
      display: none;
    }

    .piece {
      width: var(--piece-size);
      height: var(--piece-height);
      max-width: 100%;
      max-height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
      position: relative;
      isolation: isolate;
      overflow: visible;
      transform: rotate(var(--rotation, 0deg));
      transform-origin: center;
      transition: transform .16s ease;
    }

    .piece svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 8px 14px rgba(26, 35, 52, .22));
    }

    .piece-outline {
      fill: none;
      stroke: rgba(24, 32, 47, .42);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .piece.in-board {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      cursor: grab;
      transform: rotate(0deg);
      z-index: 2;
    }

    .piece.in-board svg {
      filter: none;
    }

    .piece.locked {
      cursor: default;
    }

    .piece.dragging {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      opacity: .92;
      transform: rotate(var(--rotation, 0deg)) scale(1.035);
    }

    .piece.in-board.dragging {
      transform: scale(1.035);
    }

    .selected {
      outline: 3px solid rgba(36, 107, 254, .7);
      outline-offset: 2px;
    }

    .status {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(216, 221, 231, .92);
      background: rgba(255,255,255,.82);
      color: var(--muted);
      font-size: 13px;
    }

    .status strong {
      color: var(--ink);
    }

    .status.win {
      border-color: rgba(32, 147, 107, .42);
      background: rgba(32, 147, 107, .09);
      color: #155a43;
    }

    .file-label {
      min-width: 0;
    }

    .file-label input {
      width: 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(14px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      background: rgba(24,32,47,.94);
      color: white;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(26,35,52,.25);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 1200;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .win-layer {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(1px);
      z-index: 5;
      pointer-events: none;
    }

    .win-layer.show {
      display: grid;
    }

    .win-badge {
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(32,147,107,.45);
      color: #155a43;
      font-weight: 800;
      box-shadow: 0 16px 38px rgba(26,35,52,.18);
    }

    @media (max-width: 1050px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .topbar {
        order: 1;
      }

      .side {
        display: contents;
      }

      .side > .panel {
        order: 3;
      }

      .side > .preview {
        order: 4;
      }

      .tray-panel {
        order: 0;
      }

      .stage {
        order: 2;
      }

      .board-wrap {
        min-height: auto;
      }

      .board-frame {
        max-height: none;
      }

      .tray {
        height: 30vh;
        min-height: 150px;
        max-height: 280px;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .brand {
        min-width: 0;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .file-label {
        grid-column: 1 / -1;
      }

      .mode-card {
        grid-column: 1 / -1;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tray {
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      }
    }
  </style>
</head>
<body data-mode="play">
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="图片拼图小游戏">
        <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div>
          <h1>图片拼图</h1>
          <div class="meta" id="gridMeta">10 x 10 · 100块</div>
        </div>
      </div>

      <div class="controls">
        <label class="file-label">
          <span class="sr-only">上传图片</span>
          <input id="imageInput" type="file" accept="image/*">
        </label>

        <div class="mode-card">
          <div class="mode-tabs" role="tablist" aria-label="图片处理模式">
            <button id="playTab" class="mode-tab" type="button" role="tab" aria-selected="true" aria-controls="playPanel">开始拼图</button>
            <button id="downloadTab" class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="downloadPanel">下载拼图</button>
          </div>

          <label class="field-label">
            <span class="control-label">拼图块数</span>
            <select id="pieceSelect" aria-label="块数">
              <option value="2x2">4块 · 2x2</option>
              <option value="3x3">9块 · 3x3</option>
              <option value="4x4">16块 · 4x4</option>
              <option value="5x5">25块 · 5x5</option>
              <option value="6x6">36块 · 6x6</option>
              <option value="6x8">48块 · 6x8</option>
              <option value="8x8">64块 · 8x8</option>
              <option value="8x10">80块 · 8x10</option>
              <option value="10x10" selected>100块 · 10x10</option>
            </select>
          </label>

          <section id="playPanel" class="mode-panel game-setup" role="tabpanel" aria-labelledby="playTab">
            <button id="newGame" class="primary" type="button" title="开始拼图">开始拼图</button>
          </section>

          <section id="downloadPanel" class="mode-panel" role="tabpanel" aria-labelledby="downloadTab" hidden>
            <div class="download-preview">
              <canvas id="downloadPreview" aria-label="带缝隙拼图预览"></canvas>
              <div class="download-preview-meta" id="downloadPreviewMeta">预览会按当前块数生成异形拼图缝隙</div>
            </div>
            <div class="download-setup">
              <label class="field-label">
                <span class="control-label">缝隙大小</span>
                <span class="gap-row">
                  <input id="gapSize" type="range" min="0" max="36" value="8" step="1" aria-label="下载图片缝隙大小">
                  <span class="gap-value" id="gapValue">8px</span>
                </span>
              </label>
              <button id="downloadPuzzle" type="button" title="下载带缝隙的完整拼图PNG">下载PNG</button>
            </div>
          </section>
        </div>

        <button id="previewToggle" class="icon" type="button" title="显示/隐藏原图" aria-pressed="true">◐</button>
        <button id="resetBoard" class="icon" type="button" title="清空棋盘">↺</button>
      </div>
    </header>

    <section class="stage" aria-label="拼图区">
      <div class="board-wrap">
        <div class="board-frame" id="boardFrame">
          <div id="board" aria-label="拼图棋盘"></div>
          <div class="win-layer" id="winLayer"><div class="win-badge">完成</div></div>
        </div>
      </div>
      <div class="status" id="status"><strong>已生成默认风景图</strong><span>可直接开始拼</span></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="stats">
          <div class="stat"><b id="placedCount">0</b><span>已放置</span></div>
          <div class="stat"><b id="correctCount">0</b><span>正确</span></div>
          <div class="stat"><b id="timerText">00:00</b><span>用时</span></div>
        </div>
      </section>

      <section class="panel preview" id="previewPanel">
        <div class="preview-head">
          <h2 class="panel-title">原图</h2>
          <button id="peekButton" class="ghost" type="button">预览</button>
        </div>
        <div class="preview-box">
          <img id="previewImage" alt="拼图原图">
        </div>
      </section>

      <section class="panel tray-panel">
        <div class="tray-head">
          <h2 class="panel-title">碎片</h2>
          <div class="tray-actions">
            <button id="shufflePieces" class="icon" type="button" title="打乱碎片">⇄</button>
          </div>
        </div>
        <div class="tray" id="tray" aria-label="碎片区"></div>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      rows: 10,
      cols: 10,
      imageUrl: "",
      imageRatio: 4 / 3,
      pieces: [],
      cells: [],
      selectedPieceId: null,
      drag: null,
      startedAt: null,
      timerId: null,
      elapsed: 0,
      previewVisible: true,
      won: false,
      gameId: 0,
      svgId: 0,
      activeMode: "play",
      previewToken: 0,
      previewRaf: 0,
      downloadShapeKey: "",
      downloadEdgeMaps: null
    };

    const els = {
      imageInput: document.querySelector("#imageInput"),
      playTab: document.querySelector("#playTab"),
      downloadTab: document.querySelector("#downloadTab"),
      playPanel: document.querySelector("#playPanel"),
      downloadPanel: document.querySelector("#downloadPanel"),
      pieceSelect: document.querySelector("#pieceSelect"),
      newGame: document.querySelector("#newGame"),
      gapSize: document.querySelector("#gapSize"),
      gapValue: document.querySelector("#gapValue"),
      downloadPuzzle: document.querySelector("#downloadPuzzle"),
      downloadPreview: document.querySelector("#downloadPreview"),
      downloadPreviewMeta: document.querySelector("#downloadPreviewMeta"),
      previewToggle: document.querySelector("#previewToggle"),
      resetBoard: document.querySelector("#resetBoard"),
      boardFrame: document.querySelector("#boardFrame"),
      board: document.querySelector("#board"),
      tray: document.querySelector("#tray"),
      previewPanel: document.querySelector("#previewPanel"),
      previewImage: document.querySelector("#previewImage"),
      peekButton: document.querySelector("#peekButton"),
      shufflePieces: document.querySelector("#shufflePieces"),
      placedCount: document.querySelector("#placedCount"),
      correctCount: document.querySelector("#correctCount"),
      timerText: document.querySelector("#timerText"),
      status: document.querySelector("#status"),
      gridMeta: document.querySelector("#gridMeta"),
      toast: document.querySelector("#toast"),
      winLayer: document.querySelector("#winLayer")
    };

    function makeDemoImage() {
      const canvas = document.createElement("canvas");
      const width = 1200;
      const height = 800;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      const sky = ctx.createLinearGradient(0, 0, 0, height * .72);
      sky.addColorStop(0, "#76b9f8");
      sky.addColorStop(.42, "#cde9ff");
      sky.addColorStop(.76, "#ffd6a0");
      sky.addColorStop(1, "#f69b82");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      drawCloud(ctx, 188, 142, 1.08);
      drawCloud(ctx, 780, 104, .86);
      drawCloud(ctx, 1010, 214, .72);

      ctx.fillStyle = "#fdf1b5";
      ctx.beginPath();
      ctx.arc(958, 172, 78, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#5d83a0";
      drawMountain(ctx, [[0, 548], [120, 438], [244, 490], [354, 332], [506, 548], [636, 388], [768, 554], [900, 420], [1034, 555], [1200, 392], [1200, 800], [0, 800]]);
      ctx.fillStyle = "#2d5470";
      drawMountain(ctx, [[0, 606], [150, 502], [274, 562], [436, 422], [600, 612], [742, 480], [894, 628], [1038, 516], [1200, 608], [1200, 800], [0, 800]]);
      ctx.fillStyle = "#f8fbff";
      drawMountain(ctx, [[323, 368], [354, 332], [397, 393], [365, 377], [344, 398]]);
      drawMountain(ctx, [[608, 417], [636, 388], [674, 436], [644, 425], [625, 448]]);
      drawMountain(ctx, [[1164, 429], [1200, 392], [1200, 462], [1188, 442]]);

      ctx.fillStyle = "#244c45";
      for (let i = 0; i < 58; i += 1) {
        const x = -20 + i * 22;
        const h = 58 + (i % 9) * 8;
        drawPine(ctx, x, 542 + (i % 5) * 8, h, .72 + (i % 4) * .08);
      }

      const water = ctx.createLinearGradient(0, 560, 0, height);
      water.addColorStop(0, "#5db4c5");
      water.addColorStop(.46, "#277f99");
      water.addColorStop(1, "#174963");
      ctx.fillStyle = water;
      ctx.fillRect(0, 574, width, 226);

      for (let i = 0; i < 34; i += 1) {
        ctx.strokeStyle = `rgba(255,255,255,${.12 + (i % 5) * .045})`;
        ctx.lineWidth = i % 3 === 0 ? 3 : 2;
        ctx.beginPath();
        const y = 592 + i * 6;
        ctx.moveTo((i * 47) % 210, y);
        ctx.bezierCurveTo(238, y + 16, 430, y - 20, 616, y + 1);
        ctx.bezierCurveTo(832, y + 22, 972, y - 12, 1190, y + 7);
        ctx.stroke();
      }

      const bank = ctx.createLinearGradient(0, 704, 0, height);
      bank.addColorStop(0, "#5d8b56");
      bank.addColorStop(.62, "#2d6548");
      bank.addColorStop(1, "#1a3f33");
      ctx.fillStyle = bank;
      ctx.beginPath();
      ctx.moveTo(0, 736);
      ctx.bezierCurveTo(186, 686, 336, 746, 510, 708);
      ctx.bezierCurveTo(692, 670, 822, 736, 984, 692);
      ctx.bezierCurveTo(1088, 664, 1160, 684, 1200, 654);
      ctx.lineTo(1200, 800);
      ctx.lineTo(0, 800);
      ctx.closePath();
      ctx.fill();

      for (let i = 0; i < 36; i += 1) {
        const x = (i * 37) % 1220 - 18;
        const y = 712 + (i % 6) * 13;
        drawGrass(ctx, x, y, 18 + (i % 5) * 5);
      }

      return canvas.toDataURL("image/png");
    }

    function drawMountain(ctx, points) {
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    }

    function drawCloud(ctx, x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "rgba(255,255,255,.74)";
      [0, 34, 74, 112].forEach((offset, index) => {
        ctx.beginPath();
        ctx.arc(offset, index % 2 ? 2 : 10, index === 2 ? 34 : 25, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillRect(-8, 4, 144, 30);
      ctx.restore();
    }

    function drawPine(ctx, x, y, size, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#18392f";
      ctx.fillRect(-3, 0, 6, size * .42);
      ctx.fillStyle = "#24533f";
      for (let i = 0; i < 4; i += 1) {
        const top = -size + i * size * .2;
        const half = size * (.33 - i * .04);
        ctx.beginPath();
        ctx.moveTo(0, top);
        ctx.lineTo(-half, top + size * .32);
        ctx.lineTo(half, top + size * .32);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawGrass(ctx, x, y, height) {
      ctx.strokeStyle = "rgba(223, 231, 151, .66)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i += 1) {
        ctx.beginPath();
        ctx.moveTo(x + i * 5, y);
        ctx.quadraticCurveTo(x + i * 5 - 7, y - height * .52, x + i * 3, y - height);
        ctx.stroke();
      }
    }

    function parseGrid(value) {
      const [rows, cols] = value.split("x").map(Number);
      return { rows, cols };
    }

    function setCssVars() {
      const total = state.rows * state.cols;
      const gap = total >= 100 ? 1 : 2;
      const compact = total >= 100 ? 52 : total >= 64 ? 58 : 72;
      const trayRatio = state.imageRatio * state.cols / state.rows;
      const pieceHeight = Math.max(34, compact / trayRatio);
      const tab = Math.max(7, Math.min(12, compact * .18));
      document.documentElement.style.setProperty("--rows", state.rows);
      document.documentElement.style.setProperty("--cols", state.cols);
      document.documentElement.style.setProperty("--image-url", `url("${state.imageUrl}")`);
      document.documentElement.style.setProperty("--image-ratio", state.imageRatio);
      document.documentElement.style.setProperty("--piece-size", `${compact}px`);
      document.documentElement.style.setProperty("--piece-height", `${pieceHeight}px`);
      document.documentElement.style.setProperty("--piece-tab", `${tab}px`);
      document.documentElement.style.setProperty("--piece-slot-width", `${compact + tab * 2.4}px`);
      document.documentElement.style.setProperty("--piece-slot-height", `${pieceHeight + tab * 2.8}px`);
      document.documentElement.style.setProperty("--gap", `${gap}px`);
    }

    function randomEdge(rng = Math.random) {
      return rng() > .5 ? 1 : -1;
    }

    function randomRotation() {
      let angle = Math.round(Math.random() * 36 - 18);
      if (Math.abs(angle) < 4) angle += angle < 0 ? -7 : 7;
      return angle;
    }

    function makeEdgeMaps(rows = state.rows, cols = state.cols, rng = Math.random) {
      const vertical = Array.from({ length: rows }, () =>
        Array.from({ length: Math.max(0, cols - 1) }, () => randomEdge(rng))
      );
      const horizontal = Array.from({ length: Math.max(0, rows - 1) }, () =>
        Array.from({ length: cols }, () => randomEdge(rng))
      );
      return { vertical, horizontal };
    }

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function hashString(value) {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i += 1) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function getDownloadEdgeMaps(rows, cols) {
      const key = `${rows}x${cols}`;
      if (state.downloadShapeKey !== key || !state.downloadEdgeMaps) {
        state.downloadShapeKey = key;
        state.downloadEdgeMaps = makeEdgeMaps(rows, cols, seededRandom(hashString(`download-${key}`)));
      }
      return state.downloadEdgeMaps;
    }

    function getEdgesFromMaps(edgeMaps, row, col, rows, cols) {
      return {
        top: row === 0 ? 0 : -edgeMaps.horizontal[row - 1][col],
        right: col === cols - 1 ? 0 : edgeMaps.vertical[row][col],
        bottom: row === rows - 1 ? 0 : edgeMaps.horizontal[row][col],
        left: col === 0 ? 0 : -edgeMaps.vertical[row][col - 1]
      };
    }

    function buildPieces() {
      const pieces = [];
      const edgeMaps = makeEdgeMaps();
      let id = 0;
      for (let row = 0; row < state.rows; row += 1) {
        for (let col = 0; col < state.cols; col += 1) {
          pieces.push({
            id,
            row,
            col,
            correctCell: id,
            edges: getEdgesFromMaps(edgeMaps, row, col, state.rows, state.cols),
            rotation: randomRotation(),
            location: "tray",
            cell: null
          });
          id += 1;
        }
      }
      state.pieces = shuffleArray(pieces);
      state.cells = Array.from({ length: state.rows * state.cols }, () => null);
    }

    function shuffleArray(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createPieceEl(piece) {
      const el = document.createElement("div");
      el.className = "piece";
      el.draggable = false;
      el.dataset.id = piece.id;
      el.style.setProperty("--row", piece.row);
      el.style.setProperty("--col", piece.col);
      el.style.setProperty("--rotation", `${piece.rotation}deg`);
      el.append(createPieceSvg(piece));
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "拼图碎片");
      el.addEventListener("pointerdown", startDrag);
      el.addEventListener("click", selectPiece);
      return el;
    }

    function createPieceSvg(piece) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      const cellRatio = state.imageRatio * state.cols / state.rows;
      const w = 100;
      const h = Math.max(44, 100 / cellRatio);
      const clipId = `clip-${state.gameId}-${piece.id}-${state.svgId++}`;
      const pathD = createPuzzlePath(piece.edges, w, h);

      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");

      const defs = document.createElementNS(ns, "defs");
      const clipPath = document.createElementNS(ns, "clipPath");
      const clipShape = document.createElementNS(ns, "path");
      clipPath.setAttribute("id", clipId);
      clipPath.setAttribute("clipPathUnits", "userSpaceOnUse");
      clipShape.setAttribute("d", pathD);
      clipPath.append(clipShape);
      defs.append(clipPath);

      const image = document.createElementNS(ns, "image");
      image.setAttribute("href", state.imageUrl);
      image.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", state.imageUrl);
      image.setAttribute("x", -piece.col * w);
      image.setAttribute("y", -piece.row * h);
      image.setAttribute("width", state.cols * w);
      image.setAttribute("height", state.rows * h);
      image.setAttribute("preserveAspectRatio", "none");
      image.setAttribute("clip-path", `url(#${clipId})`);

      const outline = document.createElementNS(ns, "path");
      outline.setAttribute("class", "piece-outline");
      outline.setAttribute("d", pathD);

      svg.append(defs, image, outline);
      return svg;
    }

    function createPuzzlePath(edges, w, h) {
      const tab = Math.min(w, h) * .22;
      const x1 = w * .34;
      const x2 = w * .66;
      const y1 = h * .34;
      const y2 = h * .66;
      const parts = [`M 0 0`];

      if (edges.top === 0) {
        parts.push(`L ${w} 0`);
      } else {
        parts.push(`L ${x1} 0 C ${x1} ${-edges.top * tab} ${x2} ${-edges.top * tab} ${x2} 0 L ${w} 0`);
      }

      if (edges.right === 0) {
        parts.push(`L ${w} ${h}`);
      } else {
        parts.push(`L ${w} ${y1} C ${w + edges.right * tab} ${y1} ${w + edges.right * tab} ${y2} ${w} ${y2} L ${w} ${h}`);
      }

      if (edges.bottom === 0) {
        parts.push(`L 0 ${h}`);
      } else {
        parts.push(`L ${x2} ${h} C ${x2} ${h + edges.bottom * tab} ${x1} ${h + edges.bottom * tab} ${x1} ${h} L 0 ${h}`);
      }

      if (edges.left === 0) {
        parts.push(`L 0 0`);
      } else {
        parts.push(`L 0 ${y2} C ${-edges.left * tab} ${y2} ${-edges.left * tab} ${y1} 0 ${y1} L 0 0`);
      }

      parts.push("Z");
      return parts.join(" ");
    }

    function renderBoard() {
      els.board.innerHTML = "";
      for (let i = 0; i < state.rows * state.cols; i += 1) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.cell = i;
        cell.addEventListener("click", handleCellClick);
        els.board.append(cell);
      }
    }

    function renderPieces() {
      document.querySelectorAll(".piece").forEach(pieceEl => pieceEl.remove());
      document.querySelectorAll(".cell").forEach(cell => cell.classList.remove("locked", "target"));
      els.tray.innerHTML = "";

      state.pieces.forEach(piece => {
        if (piece.location === "tray") {
          const slot = document.createElement("div");
          slot.className = "piece-slot";
          slot.dataset.slot = piece.id;
          slot.append(createPieceEl(piece));
          els.tray.append(slot);
        }
      });

      state.cells.forEach((pieceId, cellIndex) => {
        if (pieceId === null) return;
        const piece = state.pieces.find(item => item.id === pieceId);
        const cell = els.board.querySelector(`[data-cell="${cellIndex}"]`);
        const pieceEl = createPieceEl(piece);
        pieceEl.classList.add("in-board");
        pieceEl.style.zIndex = pieceId === cellIndex ? 3 : 2;
        if (pieceId === cellIndex) {
          pieceEl.classList.add("locked");
          cell.classList.add("locked");
        }
        cell.append(pieceEl);
      });

      updateStats();
      updateSelection();
    }

    function startGame({ keepImage = true } = {}) {
      const grid = parseGrid(els.pieceSelect.value);
      state.rows = grid.rows;
      state.cols = grid.cols;
      state.selectedPieceId = null;
      state.won = false;
      state.gameId += 1;
      state.svgId = 0;
      state.elapsed = 0;
      state.startedAt = Date.now();
      window.clearInterval(state.timerId);
      state.timerId = window.setInterval(updateTimer, 500);
      if (!keepImage || !state.imageUrl) {
        setImage(makeDemoImage(), 1200 / 800);
      }
      setCssVars();
      buildPieces();
      renderBoard();
      renderPieces();
      els.previewImage.src = state.imageUrl;
      els.gridMeta.textContent = `${state.rows} x ${state.cols} · ${state.rows * state.cols}块`;
      els.winLayer.classList.remove("show");
      setStatus("已开始拼图", `${state.rows * state.cols}块 · 碎片已随机旋转`);
      updateTimer();
    }

    function setImage(url, ratio) {
      if (state.imageUrl && state.imageUrl.startsWith("blob:")) {
        URL.revokeObjectURL(state.imageUrl);
      }
      state.imageUrl = url;
      state.imageRatio = ratio || 4 / 3;
      els.previewImage.src = url;
    }

    function selectPiece(event) {
      if (state.drag) return;
      const pieceEl = event.currentTarget;
      const pieceId = Number(pieceEl.dataset.id);
      const piece = getPiece(pieceId);
      if (!piece || piece.id === piece.cell) return;
      state.selectedPieceId = state.selectedPieceId === pieceId ? null : pieceId;
      updateSelection();
    }

    function updateSelection() {
      document.querySelectorAll(".piece.selected").forEach(el => el.classList.remove("selected"));
      if (state.selectedPieceId === null) return;
      document.querySelectorAll(`.piece[data-id="${state.selectedPieceId}"]`).forEach(el => el.classList.add("selected"));
    }

    function handleCellClick(event) {
      const cellIndex = Number(event.currentTarget.dataset.cell);
      if (state.selectedPieceId === null) return;
      placePiece(state.selectedPieceId, cellIndex);
      state.selectedPieceId = null;
      renderPieces();
      checkWin();
    }

    function startDrag(event) {
      if (event.button !== 0 && event.pointerType !== "touch") return;
      const sourceEl = event.currentTarget;
      const pieceId = Number(sourceEl.dataset.id);
      const piece = getPiece(pieceId);
      if (!piece || piece.id === piece.cell) return;
      event.preventDefault();
      sourceEl.setPointerCapture?.(event.pointerId);

      const rect = sourceEl.getBoundingClientRect();
      const ghost = sourceEl.cloneNode(true);
      ghost.classList.add("dragging");
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.height}px`;
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      document.body.append(ghost);

      state.drag = {
        pointerId: event.pointerId,
        pieceId,
        ghost,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top
      };
      sourceEl.style.visibility = "hidden";
      document.addEventListener("pointermove", moveDrag);
      document.addEventListener("pointerup", endDrag);
      document.addEventListener("pointercancel", cancelDrag);
      moveDrag(event);
    }

    function moveDrag(event) {
      if (!state.drag || event.pointerId !== state.drag.pointerId) return;
      const x = event.clientX - state.drag.offsetX;
      const y = event.clientY - state.drag.offsetY;
      state.drag.ghost.style.left = `${x}px`;
      state.drag.ghost.style.top = `${y}px`;

      const cell = getCellFromPoint(event.clientX, event.clientY);
      document.querySelectorAll(".cell.target").forEach(el => el.classList.remove("target"));
      if (cell) cell.classList.add("target");
    }

    function endDrag(event) {
      if (!state.drag || event.pointerId !== state.drag.pointerId) return;
      const cell = getCellFromPoint(event.clientX, event.clientY);
      const pieceId = state.drag.pieceId;
      cleanupDrag();
      if (cell) {
        placePiece(pieceId, Number(cell.dataset.cell));
      } else {
        moveToTray(pieceId);
      }
      renderPieces();
      checkWin();
    }

    function cancelDrag() {
      cleanupDrag();
      renderPieces();
    }

    function cleanupDrag() {
      if (!state.drag) return;
      state.drag.ghost.remove();
      document.querySelectorAll(".piece").forEach(el => { el.style.visibility = ""; });
      document.querySelectorAll(".cell.target").forEach(el => el.classList.remove("target"));
      document.removeEventListener("pointermove", moveDrag);
      document.removeEventListener("pointerup", endDrag);
      document.removeEventListener("pointercancel", cancelDrag);
      state.drag = null;
    }

    function getCellFromPoint(x, y) {
      const candidates = document.elementsFromPoint(x, y);
      return candidates.find(el => el.classList && el.classList.contains("cell")) || null;
    }

    function placePiece(pieceId, cellIndex) {
      const piece = getPiece(pieceId);
      if (!piece) return;
      const existingId = state.cells[cellIndex];
      if (existingId === pieceId) return;
      if (existingId !== null) {
        moveToTray(existingId, false);
      }
      if (piece.cell !== null) {
        state.cells[piece.cell] = null;
      }
      piece.location = "board";
      piece.cell = cellIndex;
      state.cells[cellIndex] = pieceId;
    }

    function moveToTray(pieceId, appendToEnd = true) {
      const piece = getPiece(pieceId);
      if (!piece) return;
      if (piece.cell !== null) {
        state.cells[piece.cell] = null;
      }
      piece.location = "tray";
      piece.cell = null;
      piece.rotation = randomRotation();
      if (appendToEnd) {
        state.pieces = state.pieces.filter(item => item.id !== pieceId).concat(piece);
      }
    }

    function getPiece(pieceId) {
      return state.pieces.find(piece => piece.id === pieceId);
    }

    function updateStats() {
      const placed = state.cells.filter(value => value !== null).length;
      const correct = state.cells.reduce((sum, value, index) => sum + (value === index ? 1 : 0), 0);
      els.placedCount.textContent = placed;
      els.correctCount.textContent = correct;
    }

    function checkWin() {
      const total = state.rows * state.cols;
      const correct = state.cells.reduce((sum, value, index) => sum + (value === index ? 1 : 0), 0);
      if (correct === total && !state.won) {
        state.won = true;
        window.clearInterval(state.timerId);
        els.winLayer.classList.add("show");
        els.status.classList.add("win");
        setStatus("拼好了", `用时 ${formatTime(state.elapsed)}`);
        showToast("完成");
      } else if (correct !== total) {
        els.status.classList.remove("win");
      }
    }

    function updateTimer() {
      if (!state.startedAt || state.won) return;
      state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
      els.timerText.textContent = formatTime(state.elapsed);
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60).toString().padStart(2, "0");
      const sec = (seconds % 60).toString().padStart(2, "0");
      return `${min}:${sec}`;
    }

    function setStatus(title, detail = "") {
      els.status.innerHTML = `<strong>${escapeHtml(title)}</strong>${detail ? `<span>${escapeHtml(detail)}</span>` : ""}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1300);
    }

    function getGapSize() {
      return Math.max(0, Math.min(36, Number(els.gapSize.value) || 0));
    }

    function getSelectedGrid() {
      return parseGrid(els.pieceSelect.value);
    }

    function syncGapLabel() {
      els.gapValue.textContent = `${getGapSize()}px`;
    }

    function switchMode(mode) {
      state.activeMode = mode;
      const isDownload = mode === "download";
      document.body.dataset.mode = mode;
      els.playTab.setAttribute("aria-selected", String(!isDownload));
      els.downloadTab.setAttribute("aria-selected", String(isDownload));
      els.playPanel.hidden = isDownload;
      els.downloadPanel.hidden = !isDownload;
      if (isDownload) scheduleDownloadPreview();
    }

    function scheduleDownloadPreview() {
      if (state.previewRaf) window.cancelAnimationFrame(state.previewRaf);
      state.previewRaf = window.requestAnimationFrame(() => {
        state.previewRaf = 0;
        updateDownloadPreview();
      });
    }

    function loadCanvasImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawSolvedPuzzleToCanvas(canvas, image, rows, cols, gap, maxWidth = 0) {
      const sourceW = image.naturalWidth || image.width;
      const sourceH = image.naturalHeight || image.height;
      const scale = maxWidth ? Math.min(1, maxWidth / sourceW) : 1;
      const tileW = (sourceW / cols) * scale;
      const tileH = (sourceH / rows) * scale;
      const drawW = sourceW * scale;
      const drawH = sourceH * scale;
      const seam = gap * scale;
      const edgeMaps = getDownloadEdgeMaps(rows, cols);
      canvas.width = Math.max(1, Math.round(drawW));
      canvas.height = Math.max(1, Math.round(drawH));
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const dx = col * tileW;
          const dy = row * tileH;
          const edges = getEdgesFromMaps(edgeMaps, row, col, rows, cols);
          const path = new Path2D(createPuzzlePath(edges, tileW, tileH));
          ctx.save();
          ctx.translate(dx, dy);
          ctx.clip(path);
          ctx.drawImage(image, -dx, -dy, drawW, drawH);
          ctx.restore();
        }
      }

      if (seam > 0) {
        ctx.save();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = seam;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            const dx = col * tileW;
            const dy = row * tileH;
            const edges = getEdgesFromMaps(edgeMaps, row, col, rows, cols);
            const path = new Path2D(createPuzzlePath(edges, tileW, tileH));
            ctx.save();
            ctx.translate(dx, dy);
            ctx.stroke(path);
            ctx.restore();
          }
        }
        ctx.restore();
      }

      return {
        width: canvas.width,
        height: canvas.height,
        exportWidth: Math.round(sourceW),
        exportHeight: Math.round(sourceH)
      };
    }

    async function updateDownloadPreview() {
      if (!state.imageUrl) {
        els.downloadPreviewMeta.textContent = "上传图片后显示预览";
        return;
      }

      const token = ++state.previewToken;
      try {
        const image = await loadCanvasImage(state.imageUrl);
        if (token !== state.previewToken) return;
        const { rows, cols } = getSelectedGrid();
        const gap = getGapSize();
        const previewMax = Math.max(260, Math.min(520, (els.downloadPreview.parentElement?.clientWidth || 440) - 12));
        const size = drawSolvedPuzzleToCanvas(els.downloadPreview, image, rows, cols, gap, previewMax);
        els.downloadPreviewMeta.textContent = `${rows} x ${cols} · ${rows * cols}块 · 异形缝隙 ${gap}px · 导出 ${size.exportWidth} x ${size.exportHeight}px`;
      } catch (error) {
        console.error(error);
        els.downloadPreviewMeta.textContent = "预览生成失败";
      }
    }

    async function downloadSolvedPuzzlePng() {
      if (!state.imageUrl) {
        showToast("请先上传图片");
        return;
      }

      const buttonText = els.downloadPuzzle.textContent;
      els.downloadPuzzle.disabled = true;
      els.downloadPuzzle.textContent = "生成中";

      try {
        const image = await loadCanvasImage(state.imageUrl);
        const { rows, cols } = getSelectedGrid();
        const gap = getGapSize();
        const canvas = document.createElement("canvas");
        drawSolvedPuzzleToCanvas(canvas, image, rows, cols, gap);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("PNG 生成失败");
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `puzzle-${rows}x${cols}-gap-${gap}px.png`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("PNG已生成");
      } catch (error) {
        console.error(error);
        showToast("下载失败");
      } finally {
        els.downloadPuzzle.disabled = false;
        els.downloadPuzzle.textContent = buttonText;
      }
    }

    function loadImageFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        showToast("请选择图片");
        return;
      }
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        setImage(url, image.naturalWidth / image.naturalHeight);
        startGame({ keepImage: true });
        scheduleDownloadPreview();
        setStatus("已载入图片", "可开始拼图或切到下载拼图预览");
      };
      image.onerror = () => {
        URL.revokeObjectURL(url);
        showToast("图片读取失败");
      };
      image.src = url;
    }

    function resetBoardToTray() {
      state.cells.forEach(pieceId => {
        if (pieceId !== null) {
          const piece = getPiece(pieceId);
          piece.location = "tray";
          piece.cell = null;
          piece.rotation = randomRotation();
        }
      });
      state.cells.fill(null);
      state.pieces = shuffleArray(state.pieces);
      state.selectedPieceId = null;
      state.won = false;
      els.winLayer.classList.remove("show");
      els.status.classList.remove("win");
      state.startedAt = Date.now();
      window.clearInterval(state.timerId);
      state.timerId = window.setInterval(updateTimer, 500);
      updateTimer();
      renderPieces();
      setStatus("已清空棋盘", `${state.rows * state.cols}块 · 碎片已随机旋转`);
    }

    function togglePreview() {
      state.previewVisible = !state.previewVisible;
      els.previewPanel.style.display = state.previewVisible ? "" : "none";
      els.previewToggle.setAttribute("aria-pressed", String(state.previewVisible));
    }

    function shuffleTrayPieces() {
      const boardPieces = state.pieces.filter(piece => piece.location === "board");
      const trayPieces = shuffleArray(state.pieces.filter(piece => piece.location === "tray"));
      trayPieces.forEach(piece => { piece.rotation = randomRotation(); });
      state.pieces = boardPieces.concat(trayPieces);
      renderPieces();
    }

    els.imageInput.addEventListener("change", event => loadImageFile(event.target.files[0]));
    els.playTab.addEventListener("click", () => switchMode("play"));
    els.downloadTab.addEventListener("click", () => switchMode("download"));
    els.pieceSelect.addEventListener("change", () => {
      if (state.activeMode === "play") {
        startGame({ keepImage: true });
      } else {
        const { rows, cols } = getSelectedGrid();
        els.gridMeta.textContent = `${rows} x ${cols} · ${rows * cols}块`;
        scheduleDownloadPreview();
      }
    });
    els.newGame.addEventListener("click", () => startGame({ keepImage: true }));
    els.gapSize.addEventListener("input", () => {
      syncGapLabel();
      scheduleDownloadPreview();
    });
    els.downloadPuzzle.addEventListener("click", downloadSolvedPuzzlePng);
    els.resetBoard.addEventListener("click", resetBoardToTray);
    els.previewToggle.addEventListener("click", togglePreview);
    els.peekButton.addEventListener("mousedown", () => els.previewImage.style.filter = "none");
    els.peekButton.addEventListener("mouseup", () => els.previewImage.style.filter = "");
    els.peekButton.addEventListener("mouseleave", () => els.previewImage.style.filter = "");
    els.shufflePieces.addEventListener("click", shuffleTrayPieces);
    window.addEventListener("resize", () => {
      if (state.activeMode === "download") scheduleDownloadPreview();
    });

    window.addEventListener("beforeunload", () => {
      if (state.imageUrl && state.imageUrl.startsWith("blob:")) {
        URL.revokeObjectURL(state.imageUrl);
      }
    });

    setImage(makeDemoImage(), 1200 / 800);
    syncGapLabel();
    startGame({ keepImage: true });
    scheduleDownloadPreview();
  </script>
</body>
</html>
